<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>One Box - Store</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <img src="./img/New_Logo_OB.png" alt="One Box Logo" class="logo">
        <h1>Tienda de Aplicaciones</h1>
    </header>

    <main class="container" id="app-list">
        <div class="app-card focused" data-url="https://tu-servidor.com/app1.apk">
            <div class="app-icon">📺</div>
            <h3>TV Premium</h3>
            <span class="btn-download">Instalar</span>
        </div>

        <div class="app-card" data-url="https://tu-servidor.com/app2.apk">
            <div class="app-icon">🎬</div>
            <h3>Cine Pro</h3>
            <span class="btn-download">Instalar</span>
        </div>

        <div class="app-card" data-url="https://tu-servidor.com/app3.apk">
            <div class="app-icon">⚽</div>
            <h3>Futbol TV</h3>
            <span class="btn-download">Instalar</span>
        </div>

        <div class="app-card" data-url="test-apps/app_prueba.apk">
            <div class="app-icon">🤖</div>
            <h3>App de Prueba</h3>
            <span class="btn-download">Instalar</span>
        </div>

        <div class="app-card" data-url="https://dl.dropboxusercontent.com/scl/fi/haxar4qh7w9x4vbwniqxc/PLayer-Pro.apk?rlkey=dxyoiuxa2qarowm33hp0ghc4t&st=8mgdduis&dl=1">
            <div class="app-icon"><img src="./img/PLAYERPRO.jpg" alt=""></div>
            <h3>Player Pro</h3>
            <span class="btn-download">Instalar</span>
        </div>

        <div class="app-card" data-url="https://dl.dropboxusercontent.com/scl/fi/qtxh0ryczk6i3hq28osub/Magma_1.0.9.apk?rlkey=vlbd3e9zn1p90qco5stg2k6qy&st=o0fjcgdv&dl=1">
            <div class="app-icon"><img src="./img/Magma.jpg" alt=""></div>
            <h3>Magma</h3>
            <h5>V1.0.9</h5>
            <span class="btn-download">Instalar</span>
        </div>
        <div class="app-card" data-url="https://dl.dropboxusercontent.com/scl/fi/4nu54fydrhirinqxzbm41/Infiniti-Stream-Tit-n4.0.apk?rlkey=uhgt7vo2vhzlqptocn9bantwq&st=2mfpgv1d&dl=1">
            <div class="app-icon"><img src="./img/infiniti.jpg" alt=""></div>
            <h3>Infiniti Stream</h3>
            <h5>V4.0</h5>
            <span class="btn-download">Instalar</span>
        </div>

        <div class="app-card" data-url="https://dl.dropboxusercontent.com/scl/fi/0lht3iz64zk5aph7k0r4t/MXL-MOVIES1.1.3.apk?rlkey=r8q9kkefwdz7jim30see55qkj&st=jj6lqffq&dl=1">
            <div class="app-icon"><img src="./img/MXLMOVIES.png" alt=""></div>
            <h3>MXL MOVIES1</h3>
            <h5>V1.1.3</h5>
            <span class="btn-download">Instalar</span>
        </div>

        <div class="app-card" data-url="https://dl.dropboxusercontent.com/scl/fi/wubjudyb7wopdv3zel0g6/Gunny-Play.apk?rlkey=7u4yxqcq8utk506j6j32pwdu9&st=0iqkidr5&dl=1">
            <div class="app-icon"><img src="./img/PLAYERPRO.jpg" alt=""></div>
            <h3>Gunny Play</h3>
            <span class="btn-download">Instalar</span>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
